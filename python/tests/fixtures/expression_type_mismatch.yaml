dtcsVersion: "1.0.0"
id: "expression.type_mismatch"
name: "Expression Type Mismatch"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

expressions:
  - id: "double_value"
    expr: "in.value * 2"
    type: "string"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
