dtcsVersion: "1.0.0"
id: "bad.postcondition.phase"
name: "Bad Postcondition Phase"
version: "0.1.0"

inputs:
  - id: "source"
    schema:
      fields:
        - name: "id"
          type: "string"
          nullable: false

outputs:
  - id: "result"
    postconditions:
      - rule: "wrong_phase_rule"
    schema:
      fields:
        - name: "id"
          type: "string"
          nullable: false

rules:
  - id: "wrong_phase_rule"
    rule: "dtcs:not_null"
    target: "result.id"
    phase: precondition

lineage:
  mappings:
    - output: "result"
      inputs: ["source"]
