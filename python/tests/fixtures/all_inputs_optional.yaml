dtcsVersion: "1.0.0"
id: "all.optional"
name: "All Optional Inputs"
version: "0.1.0"

inputs:
  - id: "a"
    optional: true
    schema:
      fields:
        - name: "x"
          type: "string"
          nullable: false
  - id: "b"
    optional: true
    schema:
      fields:
        - name: "y"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "z"
          type: "string"
          nullable: false

lineage:
  mappings:
    - output: "out"
      inputs: ["a", "b"]
