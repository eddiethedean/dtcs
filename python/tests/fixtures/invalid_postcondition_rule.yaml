dtcsVersion: "1.0.0"
id: "bad.postcondition"
name: "Bad Postcondition"
version: "0.1.0"

inputs:
  - id: "source"
    schema:
      fields:
        - name: "id"
          type: "string"
          nullable: false

outputs:
  - id: "result"
    postconditions:
      - rule: "missing_rule"
    schema:
      fields:
        - name: "id"
          type: "string"
          nullable: false

lineage:
  mappings:
    - output: "result"
      inputs: ["source"]
