dtcsVersion: "1.0.0"
id: "bad.conversion"
name: "Bad Conversion"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "amount"
          type: "integer"
          nullable: false
          conversions:
            - from: "integer"
              to: "decimal"
              lossy: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "amount"
          type: "decimal"
          nullable: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
