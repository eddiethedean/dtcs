# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Custom commands so we can set NO_MKDOCS_2_WARNING before Material imports
  # and fail the build on MkDocs warnings (--strict).
  commands:
    - pip install -r docs/requirements.txt
    - NO_MKDOCS_2_WARNING=true mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"
