dtcsVersion: "1.0.0"
id: "stdlib.function.upper.valid"
name: "Stdlib Upper Valid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "text"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "text_upper"
          type: "string"
          nullable: true

functions:
  - id: "to_upper"
    function: "dtcs:upper"
    type: "string"
    nullable: true
    parameters:
      - name: "text"
        type: "string"
        optional: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
