dtcsVersion: "1.0.0"
id: "lowercase.nullable.target"
name: "Lowercase Nullable Target"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "name"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "name"
          type: "string"
          nullable: false

semanticActions:
  - id: "lower_name"
    action: "dtcs:lowercase"
    target: "in.name"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
