dtcsVersion: "1.0.0"
id: "optimize.rule.dedup.params"
name: "Optimize rule dedup params"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "code"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "code"
          type: "string"
          nullable: true

rules:
  - id: "code_min_a"
    rule: "dtcs:min_length"
    target: "in.code"
    phase: "postcondition"
    parameters:
      min: 3
  - id: "code_min_b"
    rule: "dtcs:min_length"
    target: "in.code"
    phase: "postcondition"
    parameters:
      min: 10
  - id: "code_min_dup"
    rule: "dtcs:min_length"
    target: "in.code"
    phase: "postcondition"
    parameters:
      min: 3

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
