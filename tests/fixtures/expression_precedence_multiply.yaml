dtcsVersion: "1.0.0"
id: "expression.precedence.multiply"
name: "Expression Precedence Multiply"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "a"
          type: "integer"
          nullable: false
        - name: "b"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

expressions:
  - id: "sum_then_multiply"
    expr: "in.a + in.b * 2"
    type: "integer"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
