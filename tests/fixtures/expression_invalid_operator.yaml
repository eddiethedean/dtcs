dtcsVersion: "1.0.0"
id: "expression.invalid_operator"
name: "Expression Invalid Operator"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "label"
          type: "string"
          nullable: false
        - name: "value"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "label"
          type: "string"
          nullable: false

expressions:
  - id: "bad_expr"
    expr: "in.label * in.value"
    type: "string"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
