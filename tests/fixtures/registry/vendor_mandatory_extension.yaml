dtcsVersion: "1.0.0"
id: "registry.mandatory.extension"
name: "Mandatory Vendor Extension"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]

blocked:plugin: true
