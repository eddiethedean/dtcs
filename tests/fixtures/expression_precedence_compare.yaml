dtcsVersion: "1.0.0"
id: "expression.precedence.compare"
name: "Expression Precedence Compare"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "a"
          type: "integer"
          nullable: false
        - name: "b"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "flag"
          type: "boolean"
          nullable: false

expressions:
  - id: "compare_sum"
    expr: "in.a < in.b + 1"
    type: "boolean"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
