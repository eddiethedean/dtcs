dtcsVersion: "1.0.0"
id: "function.optional.param.order"
name: "Function Optional Param Order"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

functions:
  - id: "bad_params"
    function: "vendor:sum"
    type: "integer"
    parameters:
      - name: "optional_first"
        type: "integer"
        optional: true
      - name: "required_second"
        type: "integer"
        optional: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
