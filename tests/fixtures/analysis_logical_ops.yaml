dtcsVersion: "1.0.0"
id: "analysis.logical.ops"
name: "Analysis logical ops"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "a"
          type: "integer"
          nullable: false
        - name: "b"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "ok"
          type: "boolean"
          nullable: false

expressions:
  - id: "ok_expr"
    expr: "in.a > 0 && in.b > 0"
    type: "boolean"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]

