dtcsVersion: "1.0.0"
id: "optimize.algebraic"
name: "Optimize algebraic"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

expressions:
  - id: "scale_identity"
    expr: "in.value * 1"
    type: "integer"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
