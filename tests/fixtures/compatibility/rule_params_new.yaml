dtcsVersion: "1.0.0"
id: "compat.rule_params"
name: "Rule Params New"
version: "1.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "code"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "code"
          type: "string"
          nullable: true

rules:
  - id: "code_min"
    rule: "dtcs:min_length"
    target: "in.code"
    phase: "postcondition"
    parameters:
      min: 10

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
