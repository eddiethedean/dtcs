dtcsVersion: "1.0.0"
id: "invalid.metadata.policy.uri"
name: "Invalid policy URI"
version: "0.1.0"

metadata:
  governance:
    owner: "data-platform"
    steward: "analytics"
    policyRefs:
      - "https://"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
