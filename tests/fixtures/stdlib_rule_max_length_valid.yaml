dtcsVersion: "1.0.0"
id: "stdlib.rule.max_length.valid"
name: "Stdlib Max Length Valid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "code"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "code"
          type: "string"
          nullable: true

rules:
  - id: "code_max"
    rule: "dtcs:max_length"
    target: "in.code"
    phase: "postcondition"
    parameters:
      max: 10

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
