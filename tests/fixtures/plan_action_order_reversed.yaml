dtcsVersion: "1.0.0"
id: "plan.action.order.reversed"
name: "Plan action order reversed"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

semanticActions:
  - id: "lower_value"
    action: "dtcs:lowercase"
    target: "out.value"
  - id: "trim_value"
    action: "dtcs:trim"
    target: "out.value"

semantics:
  ordering:
    mode: explicit
    order: ["lower_value", "trim_value"]

expressions:
  - id: "read_value"
    expr: "out.value"
    type: "string"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
