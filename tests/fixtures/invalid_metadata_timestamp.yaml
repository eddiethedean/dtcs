dtcsVersion: "1.0.0"
id: "bad.timestamp"
name: "Bad Timestamp"
version: "0.1.0"

metadata:
  provenance:
    createdAt: "not-a-date"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
