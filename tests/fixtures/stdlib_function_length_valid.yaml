dtcsVersion: "1.0.0"
id: "stdlib.function.length.valid"
name: "Stdlib Length Valid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "text"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "size"
          type: "integer"
          nullable: false

functions:
  - id: "len_text"
    function: "dtcs:length"
    type: "integer"
    parameters:
      - name: "text"
        type: "string"
        optional: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
