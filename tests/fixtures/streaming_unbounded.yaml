dtcsVersion: "1.0.0"
id: "streaming.example"
name: "Streaming Example"
version: "0.1.0"

inputs:
  - id: "events"
    streaming:
      mode: unbounded
    schema:
      fields:
        - name: "event_id"
          type: "string"
          nullable: false

outputs:
  - id: "aggregated"
    streaming:
      mode: bounded
    schema:
      fields:
        - name: "count"
          type: "integer"
          nullable: false

lineage:
  mappings:
    - output: "aggregated"
      inputs: ["events"]
