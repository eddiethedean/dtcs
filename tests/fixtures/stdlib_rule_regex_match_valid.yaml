dtcsVersion: "1.0.0"
id: "stdlib.rule.regex_match.valid"
name: "Stdlib Regex Match Valid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "email"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "email"
          type: "string"
          nullable: true

rules:
  - id: "email_pattern"
    rule: "dtcs:regex_match"
    target: "in.email"
    phase: "postcondition"
    parameters:
      pattern: "^[^@]+@[^@]+$"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
