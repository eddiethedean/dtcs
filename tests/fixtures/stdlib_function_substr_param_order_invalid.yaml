dtcsVersion: "1.0.0"
id: "stdlib.function.substr.param_order_invalid"
name: "Stdlib Substr Param Order Invalid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "text"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "slice"
          type: "string"
          nullable: false

functions:
  - id: "slice_text"
    function: "dtcs:substr"
    type: "string"
    parameters:
      - name: "start"
        type: "integer"
        optional: false
      - name: "text"
        type: "string"
        optional: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
