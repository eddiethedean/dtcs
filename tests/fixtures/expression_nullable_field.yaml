dtcsVersion: "1.0.0"
id: "expression.nullable.field"
name: "Expression Nullable Field"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

expressions:
  - id: "nullable_ref"
    expr: "in.value"
    type: "integer"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
