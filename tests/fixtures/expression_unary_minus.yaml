dtcsVersion: "1.0.0"
id: "expression.unary.minus"
name: "Expression Unary Minus"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

expressions:
  - id: "negate"
    expr: "-in.value"
    type: "integer"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
