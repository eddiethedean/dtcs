dtcsVersion: "1.0.0"
id: "bad.metadata.key"
name: "Bad Metadata Key"
version: "0.1.0"

metadata:
  description: "uses invalid custom key"
  customNote: "not namespaced"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
