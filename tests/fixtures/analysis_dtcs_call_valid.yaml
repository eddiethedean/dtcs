dtcsVersion: "1.0.0"
id: "analysis.dtcs.call.valid"
name: "Analysis dtcs call valid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: false

expressions:
  - id: "lowered"
    expr: "dtcs:lower(in.value)"
    type: "string"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]

