dtcsVersion: "1.0.0"
id: "optimize.constant.fold"
name: "Optimize constant fold"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false

expressions:
  - id: "const_add"
    expr: "1 + 2"
    type: "integer"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
