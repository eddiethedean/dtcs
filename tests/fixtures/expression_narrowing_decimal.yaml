dtcsVersion: "1.0.0"
id: "expression.narrowing.decimal"
name: "Expression Narrowing Decimal"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "amount"
          type: "decimal"
          nullable: false

outputs:
  - id: "out"
    schema:
      fields:
        - name: "amount"
          type: "integer"
          nullable: false

expressions:
  - id: "narrow_decimal"
    expr: "in.amount"
    type: "integer"

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
