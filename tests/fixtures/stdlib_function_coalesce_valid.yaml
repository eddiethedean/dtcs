dtcsVersion: "1.0.0"
id: "stdlib.function.coalesce.valid"
name: "Stdlib Coalesce Valid"
version: "0.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "a"
          type: "string"
          nullable: true
        - name: "b"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "string"
          nullable: true

functions:
  - id: "pick"
    function: "dtcs:coalesce"
    type: "string"
    nullable: true
    parameters:
      - name: "a"
        type: "string"
        optional: false
      - name: "b"
        type: "string"
        optional: false

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
