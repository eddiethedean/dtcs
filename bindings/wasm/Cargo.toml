[package]
name = "dtcs-wasm"
version = "0.10.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dtcs = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
