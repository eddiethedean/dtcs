dtcsVersion: "1.0.0"
id: "compat.backward"
name: "Backward New"
version: "1.1.0"

inputs:
  - id: "in"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false
  - id: "extra"
    optional: true
    schema:
      fields:
        - name: "note"
          type: "string"
          nullable: true

outputs:
  - id: "out"
    schema:
      fields:
        - name: "value"
          type: "integer"
          nullable: false
        - name: "note"
          type: "string"
          nullable: true

lineage:
  mappings:
    - output: "out"
      inputs: ["in"]
