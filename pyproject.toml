[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[project]
name = "dtcs"
version = "0.12.0"
description = "Reference implementation of the Data Transformation Contract Standard (DTCS)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["dtcs", "data-transformation", "contracts", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/eddiethedean/dtcs"
Repository = "https://github.com/eddiethedean/dtcs"
Documentation = "https://dtcs.readthedocs.io/"

[project.scripts]
dtcs = "dtcs.__main__:main"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "dtcs._native"
